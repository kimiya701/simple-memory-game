<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Memory Game</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 30px; }
    .board { display: flex; flex-wrap: wrap; width: 320px; margin: 0 auto; }
    .card {
      width: 70px; height: 70px;
      border: 1px solid #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; cursor: pointer;
      background: lightgray;
    }
    .matched { background: #8bc34a; }
  </style>
</head>
<body>

<h2>Simple Memory Game</h2>
<div class="board" id="board"></div>

<script>
  const emojis = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍒', '🍍', '🥝'];
  let cards = [...emojis, ...emojis];
  let first = null , second = null, lock = false;

  function shuffle(array) {
    array.sort(() => Math.random() - 0.5);
  }

  function createBoard() {
    shuffle(cards);
    const board = document.getElementById('board');
    cards.forEach((emoji, index) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.emoji = emoji;
      card.dataset.index = index;
      card.textContent = '';
      card.addEventListener('click', flipCard);
      board.appendChild(card);
    });
  }

  function flipCard() {
    if(lock || this.classList.contains('matched') || this === first) return;

    this.textContent = this.dataset.emoji;
    if (!first) {
      first = this;
      return;
    }

    second = this;
    lock = true;

    if (first.dataset.emoji === second.dataset.emoji) {
      first.classList.add('matched');
      second.classList.add('matched');
      reset();
    } else {
      setTimeout(() => {
        first.textContent = '';
        second.textContent = '';
        reset();
      }, 800);
    }
  }

  function reset() {
    [first, second, lock] = [null, null, false];
  }

  createBoard();
</script>

</body>
</html>
